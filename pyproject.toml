[project]
name = "breezes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jules", email = "you@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "scipy>=1.18.1",
]

[project.scripts]
breezes = "breezes:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
